name: Docker Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (test)
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }} \
            -t agendaflow:test .
          docker image ls agendaflow:test

      - name: Run container + healthcheck
        run: |
          docker run -d --name agendaflow -p 3001:3001 \
            -e PORT=3001 \
            -e VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }} \
            -e SUPABASE_SERVICE_ROLE_KEY=dummy \
            agendaflow:test
          sleep 8
          curl -f http://localhost:3001/api/health
          docker logs agendaflow
          docker rm -f agendaflow
